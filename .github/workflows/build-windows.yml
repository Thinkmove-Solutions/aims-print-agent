name: Build Windows agent.exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build agent.exe
        run: pyinstaller --onefile --name agent agent.py

      # Every push to main gets a downloadable build under this workflow
      # run's Actions tab — good for quick iteration/testing.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-windows
          path: dist/agent.exe

      # A version tag (e.g. `git tag v1.0.0 && git push --tags`) additionally
      # publishes a stable, permanent download link on the repo's Releases
      # page — this is the URL to hand to shops.
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/agent.exe
